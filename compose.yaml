services:
  aegys-bot:
    build: .
    container_name: aegys-bot
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "${AEGYS_PORT:-8090}:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - AEGYS_HOST=0.0.0.0
      - AEGYS_PORT=8090
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
